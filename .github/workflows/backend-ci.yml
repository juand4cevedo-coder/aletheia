name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aletheia
          POSTGRES_PASSWORD: aletheia-ci
          POSTGRES_DB: aletheia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aletheia -d aletheia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALETHEIA_DB_HOST: localhost
      ALETHEIA_DB_PORT: "5432"
      ALETHEIA_DB_USER: aletheia
      ALETHEIA_DB_PASSWORD: aletheia-ci
      ALETHEIA_DB_NAME: aletheia_test
      ALETHEIA_STORAGE_ENDPOINT_URL: http://localhost:8333
      ALETHEIA_STORAGE_ACCESS_KEY: aletheia-ci
      ALETHEIA_STORAGE_SECRET_KEY: aletheia-ci-secret
      ALETHEIA_STORAGE_BUCKET: aletheia-evidence

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start object storage
        run: |
          docker run --detach --name storage --publish 8333:8333 \
            --env AWS_ACCESS_KEY_ID="$ALETHEIA_STORAGE_ACCESS_KEY" \
            --env AWS_SECRET_ACCESS_KEY="$ALETHEIA_STORAGE_SECRET_KEY" \
            chrislusf/seaweedfs:4.47 \
            mini -dir=/data -bucket="$ALETHEIA_STORAGE_BUCKET" -admin.ui=false
          for _ in $(seq 1 30); do
            if curl --silent --output /dev/null "$ALETHEIA_STORAGE_ENDPOINT_URL"; then
              exit 0
            fi
            sleep 2
          done
          docker logs storage
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          working-directory: backend

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest
